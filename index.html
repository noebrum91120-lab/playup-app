
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLAYUP</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090909;color:white;
 font-family:Arial,sans-serif;text-align:center;
}
header{
 padding:25px 10px;color:#c56aff;
 font-size:38px;font-weight:900;
 text-shadow:0 0 10px #a000ff,0 0 25px #a000ff;
}
.panel{
 max-width:600px;margin:15px auto;padding:20px;
 border:2px solid #a000ff;border-radius:18px;
 box-shadow:0 0 15px #7900bd;
}
.hidden{display:none!important}
button{
 border:0;border-radius:12px;padding:14px 20px;
 margin:7px;font-size:17px;font-weight:bold;
 cursor:pointer;
}
.mainbtn{background:#9b24e8;color:white;width:85%}
.card{
 display:inline-flex;flex-direction:column;
 justify-content:space-between;
 width:75px;height:110px;border:3px solid white;
 border-radius:12px;margin:5px;padding:8px;
 font-size:24px;font-weight:bold;color:white;
 box-shadow:0 0 8px #aaa;
 cursor:pointer;
}
.red{background:#e52c40}
.blue{background:#2478e8}
.green{background:#159b58}
.yellow{background:#e0b522;color:black}
.black{background:#292929}
#hand{display:flex;justify-content:center;flex-wrap:wrap}
#table{padding:15px}
.small{font-size:14px;color:#bbb}
#message{min-height:28px;color:#d69aff}
input{
 padding:12px;border-radius:8px;border:1px solid #a000ff;
 margin:5px;font-size:16px;width:85%;
}
</style>
</head>
<body>

<header>PLAYUP</header>

<section id="home" class="panel">
<h2>Bienvenue sur PLAYUP</h2>
<button class="mainbtn" onclick="screen('cards')">🃏 JOUER AUX CARTES</button>
<button class="mainbtn" onclick="screen('action')">🔥 ACTION OU VÉRITÉ</button>
</section>

<section id="cards" class="panel hidden">
<h2>🃏 PLAYUP CARTES</h2>
<p>Choisissez le nombre de joueurs</p>
<select id="players">
<option value="2">2 joueurs</option>
<option value="3">3 joueurs</option>
<option value="4">4 joueurs</option>
</select>
<br>
<button class="mainbtn" onclick="startGame()">COMMENCER</button>
<div id="game" class="hidden">
<h3 id="turn"></h3>
<p id="message">À toi de jouer !</p>
<div id="table">
<p>Carte au centre :</p>
<div id="topCard"></div>
</div>
<p id="handTitle">Tes cartes :</p>
<div id="hand"></div>
<button onclick="drawCard()">PIOCHER</button>
<button onclick="passTurn()">PASSER</button>
<button onclick="screen('home')">MENU</button>
</div>
<button class="mainbtn" onclick="screen('home')">RETOUR</button>
</section>

<section id="action" class="panel hidden">
<h2>🔥 ACTION OU VÉRITÉ</h2>
<p>Choisis ton mode :</p>
<button class="mainbtn" onclick="question('action')">ACTION 🔥</button>
<button class="mainbtn" onclick="question('verite')">VÉRITÉ 💬</button>
<h3 id="question"></h3>
<button onclick="screen('home')">RETOUR</button>
</section>

<script>
function screen(id){
 document.querySelectorAll('.panel').forEach(p=>p.classList.add('hidden'));
 document.getElementById(id).classList.remove('hidden');
}

const colors=['red','blue','green','yellow'];
let players=[],hands=[],current=0,direction=1,deck=[],top=null,started=false;

function makeDeck(){
 let d=[];
 colors.forEach(c=>{
  for(let n=0;n<=9;n++){
   d.push({color:c,value:n});
   if(n>0)d.push({color:c,value:n});
  }
  ['+2','INV','PASSE'].forEach(v=>{
   d.push({color:c,value:v});
   d.push({color:c,value:v});
  });
 });
 for(let i=0;i<4;i++){
  d.push({color:'black',value:'+4'});
  d.push({color:'black',value:'COULEUR'});
 }
 return d.sort(()=>Math.random()-.5);
}
function startGame(){
 let count=Number(document.getElementById('players').value);
 players=Array.from({length:count},(_,i)=>'Joueur '+(i+1));
 hands=players.map(()=>[]);
 deck=makeDeck();
 current=0;direction=1;
 for(let i=0;i<count;i++)
  for(let j=0;j<7;j++)hands[i].push(deck.pop());
 top=deck.pop();
 while(top.color==='black')top=deck.pop();
 started=true;
 document.getElementById('game').classList.remove('hidden');
 render();
}
function render(){
 if(!started)return;
 document.getElementById('turn').textContent='Tour de '+players[current];
 document.getElementById('topCard').innerHTML=cardHTML(top,false);
 document.getElementById('hand').innerHTML=hands[current].map((c,i)=>cardHTML(c,true,i)).join('');
 document.getElementById('handTitle').textContent=players[current]+' : '+hands[current].length+' cartes';
}
function cardHTML(c,clickable,i){
 return `<div class="card ${c.color}" ${clickable?'onclick="playCard('+i+')"':''}>
 <span>${c.value}</span><span>${c.color==='black'?'★':c.color}</span></div>`;
}
function playCard(i){
 let c=hands[current][i];
 if(c.color!==top.color&&c.value!==top.value&&c.color!=='black'){
  document.getElementById('message').textContent='Carte impossible à jouer !';
  return;
 }
 hands[current].splice(i,1);
 top=c;
 if(c.color==='black'){
  let chosen=prompt('Choisis une couleur : red, blue, green ou yellow','red');
  if(!colors.includes(chosen))chosen='red';
  top={...c,color:chosen};
 }
 if(hands[current].length===0){
  alert(players[current]+' a gagné ! 🏆');
  started=false;return;
 }
 if(c.value==='INV')direction*=-1;
 if(c.value==='PASSE')nextPlayer();
 if(c.value==='+2')penalty(2);
 if(c.value==='+4')penalty(4);
 nextPlayer();
 render();
}
function nextPlayer(){
 current=(current+direction+players.length)%players.length;
}
function penalty(n){
 let target=(current+direction+players.length)%players.length;
 for(let i=0;i<n;i++)if(deck.length)hands[target].push(deck.pop());
}
function drawCard(){
 if(!deck.length){
  deck=makeDeck();
 }
 hands[current].push(deck.pop());
 nextPlayer();
 render();
}
function passTurn(){
 nextPlayer();render();
}
const actions=[
'Fais une imitation amusante.',
'Raconte une blague.',
'Chante quelques secondes.',
'Fais une danse drôle.',
'Parle avec une voix de robot.'
];
const truths=[
'Quel est ton film préféré ?',
'Quelle est ta plus grande peur ?',
'Quel est ton meilleur souvenir ?',
'Quel talent aimerais-tu avoir ?',
'Quelle est ta destination de rêve ?'
];
function question(type){
 let list=type==='action'?actions:truths;
 document.getElementById('question').textContent=list[Math.floor(Math.random()*list.length)];
}
</script>
</body>
</html>
